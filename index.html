<!-- =====================================================================
     1) Supabase SDK（多个 CDN 依次尝试，失败了也能用本地模式打开）
     ===================================================================== -->
<script>
window.__SUPABASE_READY = (function () {
  var urls = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
    'https://cdn.bootcdn.net/ajax/libs/supabase-js/2.45.4/supabase.js',
    'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.js'
  ];
  return new Promise(function (resolve) {
    var i = 0;
    function ok() { return !!(window.supabase && window.supabase.createClient); }
    function next() {
      if (ok()) return resolve(true);
      if (i >= urls.length) { console.warn('[SDK] Supabase 没加载出来，先用本地模式'); return resolve(false); }
      var s = document.createElement('script');
      var settled = false;
      s.src = urls[i++];
      s.async = true;
      s.onload = function () { if (!settled) { settled = true; ok() ? resolve(true) : next(); } };
      s.onerror = function () { if (!settled) { settled = true; s.remove(); next(); } };
      document.head.appendChild(s);
      setTimeout(function () { if (!settled) { settled = true; s.remove(); next(); } }, 7000);
    }
    next();
  });
})();
</script>
